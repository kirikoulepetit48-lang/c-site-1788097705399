<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PubMaker AI - L'shi</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#08080a;color:#fff;padding:14px;padding-bottom:90px}h1{font-size:2.3rem;text-align:center;margin-top:8px}h1 span{color:#ff2e63}.sub{text-align:center;color:#666;font-size:.85rem;margin-top:4px}.card{background:#121214;border:1px solid #232326;border-radius:24px;padding:16px;max-width:500px;margin:16px auto}.inp{width:100%;background:#000;border:1px solid #333;border-radius:12px;padding:13px;color:#fff;margin-top:8px}.btn{background:#ff2e63;color:#fff;padding:15px;border-radius:40px;font-weight:900;width:100%;border:none;font-size:1.05rem;margin-top:14px;cursor:pointer}.result{display:none;margin-top:14px}.box{background:#000;border:1px solid #222;border-radius:16px;padding:12px;margin-top:10px}.lab{color:#ff2e63;font-weight:900;font-size:.7rem;letter-spacing:1px}.copyBtn{background:#222;border:none;color:#fff;padding:6px 10px;border-radius:20px;font-size:.7rem;float:right;cursor:pointer}.pro{margin-top:14px;background:linear-gradient(135deg,#ff2e63,#ff8a00);border-radius:16px;padding:14px;text-align:center;color:#fff;display:none}.btn-pay{background:#fff;color:#ff2e63;padding:12px;border-radius:30px;display:block;text-decoration:none;font-weight:900;margin-top:8px}</style></head><body><h1>PubMaker <span>AI</span> 📢</h1><p class="sub">Ton produit → Pub TikTok + Slogan + Hashtags en 3 sec</p><div class="card"><label style="color:#888;font-size:.8rem;font-weight:700">🛍️ TON PRODUIT (ex: powerbank, pagne, poulet grillé)</label><input id="prod" class="inp" placeholder="Ex: Powerbank 20000mAh"><label style="color:#888;font-size:.8rem;font-weight:700;margin-top:12px;display:block">💰 PRIX</label><input id="price" class="inp" placeholder="Ex: 15$ ou 25000 FC"><label style="color:#888;font-size:.8rem;font-weight:700;margin-top:12px;display:block">📍 QUARTIER L'SHI</label><select id="zone" class="inp"><option>Gambela / Kenya</option><option>Kamalondo</option><option>Lubumbashi centre</option><option>Ruashi / Kampemba</option><option>Partout - Livraison</option></select><button class="btn" onclick="make()">✨ GÉNÉRER MA PUB VIRALE</button><div id="result" class="result"><div class="box"><span class="lab">🔥 TEXTE PUBLICITAIRE</span><button class="copyBtn" onclick="copy('txt1')">Copier</button><p id="txt1" style="margin-top:8px;font-size:.95rem;line-height:1.4"></p></div><div class="box"><span class="lab">💎 SLOGAN</span><button class="copyBtn" onclick="copy('slogan')">Copier</button><p id="slogan" style="margin-top:8px;font-weight:900;font-size:1.1rem"></p></div><div class="box"><span class="lab">#️⃣ HASHTAGS TIKTOK</span><button class="copyBtn" onclick="copy('tags')">Copier</button><p id="tags" style="margin-top:8px;color:#ff8a8a;font-size:.9rem"></p></div><div class="box"><span class="lab">🎬 IDÉE VIDÉO VIRALE (15 sec)</span><p id="video" style="margin-top:8px;font-size:.9rem;line-height:1.4;color:#bbb"></p></div><div class="box" style="border:1px dashed #ff2e63"><span class="lab">📱 STATUT WHATSAPP</span><p id="wa" style="margin-top:8px;font-size:.9rem"></p></div></div><div id="pro" class="pro"><p style="font-weight:900">💎 FORMULE PRO - 1.75$</p><p style="font-size:.8rem;margin-top:4px">5 variantes + script voix off + affiche HD auto (C PHOTO HD inclus)</p><a class="btn-pay" href="https://pay.fondeka.com/p/95RN25PBS" target="_blank">💳 DÉBLOQUER PRO - 1.75$</a><button onclick="unlockPro()" style="margin-top:8px;background:#000;color:#fff;border:none;padding:8px 14px;border-radius:20px;font-weight:900">✅ J'ai payé</button></div></div></div><script>
function make(){
 const p=document.getElementById('prod').value || "Powerbank 20000mAh"; const pr=document.getElementById('price').value || "15$"; const z=document.getElementById('zone').value;
 const slogans=[`${p} - L'shi ne dort plus sans toi!`, `Plus qu'un ${p}, c'est ton pouvoir!`, `${p} ya L'shi, qualité ya solo!`, `Touche ${p}, touche la vie!`];
 const texts=[`🔥 ARRIVAGE ${p.toUpperCase()} À ${z.toUpperCase()}! 🔥\n\nFatigué des produits fake? Nous c'est qualité testée!\n✅ Prix: ${pr} seulement\n✅ Stock limité - ${z}\n✅ Livraison à domicile 3000FC\n\n📲 Commande maintenant WhatsApp avant rupture!\n👇👇👇`, `💸 ${p} - ${pr} - Tu rates ça, tu rates tout!\n\nLes voisins en parlent déjà à ${z}!\nPourquoi?\n⚡ Qualité supérieure\n⚡ Prix L'shi, pas Dubai\n⚡ Garantie 1 mois\n\nTape INFO en commentaire!`];
 const tagsText=`#Lubumbashi #${p.replace(/ /g,'')} #BusinessLshi #${z.replace(/ /g,'')} #RDC #VenteLubumbashi #LshiTikTok #Gambela #CongoBusiness #fyp`;
 const videoIdeas=`0-3s: Toi tu tiens ${p} proche caméra + son "oh non non non" TikTok\n3-7s: Montre problème que ${p} résout (ex: phone éteint → allumé avec powerbank)\n7-12s: Prix ${pr} en gros texte jaune + ${z}\n12-15s: CTA "Commente INFO, livraison aujourd'hui!" + pointe vers WhatsApp`;
 const waText=`🔥 ${p} dispo! ${pr} - ${z} - Livraison aujourd'hui! Tape INFO 👉 wa.me/243979312394`;

 document.getElementById('txt1').innerText=texts[0]; document.getElementById('slogan').innerText=slogans[Math.floor(Math.random()*slogans.length)];
 document.getElementById('tags').innerText=tagsText; document.getElementById('video').innerText=videoIdeas; document.getElementById('wa').innerText=waText;
 document.getElementById('result').style.display='block'; document.getElementById('pro').style.display='block';
}
function copy(id){ navigator.clipboard.writeText(document.getElementById(id).innerText); alert('✅ Copié!'); }
function unlockPro(){ 
 const p=document.getElementById('prod').value || "Powerbank";
 document.getElementById('txt1').innerText += "\n\n--- VARIANTES PRO ---\n2) Dernière chance "+p+" à L'shi ce mois!\n3) Ton voisin l'a déjà, et toi?\n4) Qualité Kenya? Non qualité Dubai au prix L'shi\n5) Script voix off: 'Yo L'shi, ton "+p+" t'attend à...'";
 alert('✅ PRO débloqué! 5 pubs ajoutées!');
}
</script></body></html>
